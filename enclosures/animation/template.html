<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field node assembly</title>
<style>
:root{--blue:#2563eb;--ink:#0e1d3a;--mut:#6b7a96;--line:#dbe4f3;--bg:#f4f7fc}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font:15px/1.4 Inter,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.brand{position:fixed;left:24px;top:20px;display:flex;gap:12px;align-items:center}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);box-shadow:0 6px 16px rgba(37,99,235,.35)}
.brand h1{margin:0;font-size:18px;letter-spacing:-.01em}.brand p{margin:0;color:var(--mut);font-size:13px}
#steps{position:fixed;right:20px;top:20px;display:flex;flex-direction:column;gap:6px;width:236px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#ffffffd9;backdrop-filter:blur(6px);border-radius:12px;padding:7px 11px;font:inherit;font-size:13px;color:var(--mut);cursor:pointer}
.chip b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eaf0fb;color:var(--mut);font-size:12px;flex:none}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}.chip.on b{background:#ffffff33;color:#fff}
#cap{position:fixed;left:24px;bottom:96px;max-width:520px;background:#ffffffe8;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:0 10px 30px rgba(20,40,90,.10)}
#stepno{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue)}#steptitle{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:2px 0}#steptext{color:var(--mut)}
#ctl{position:fixed;left:24px;right:24px;bottom:20px;display:flex;gap:10px;align-items:center;background:#ffffffe8;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
#ctl button,#ctl select{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;color:var(--ink)}
#ctl button.on{background:var(--blue);color:#fff;border-color:var(--blue)}#play{min-width:74px;background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important;font-weight:600}
#seek{flex:1;accent-color:var(--blue)}#prog{position:fixed;left:0;top:0;height:4px;width:100%;background:transparent}#bar{height:100%;width:0;background:var(--blue)}
.legend{position:fixed;right:20px;bottom:96px;font-size:12px;color:var(--mut);text-align:right}
body.rec #ctl,body.rec .legend{display:none}body.rec #cap{bottom:28px}
@media(max-width:820px){#steps{display:none}#cap{right:24px;max-width:none}}
</style></head><body>
<canvas id="c"></canvas><div id="prog"><div id="bar"></div></div>
<div class="brand"><div class="logo"></div><div><h1>Poacher Guard field node</h1><p>Assembly animation</p></div></div>
<div id="steps"></div>
<div id="cap"><div id="stepno"></div><div id="steptitle"></div><div id="steptext"></div></div>
<div class="legend">Drag to rotate, scroll to zoom</div>
<div id="ctl"><button id="play">Pause</button><button id="restart">Restart</button><input id="seek" type="range" min="0" max="30" step="0.01" value="0">
<select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select><button id="xray">X-ray shell</button><button id="auto" class="on">Auto camera</button></div>
<script>window.__PARTS=/*PARTS*/null;</script>
<script>/*BUNDLE*/</script>
</body></html>
